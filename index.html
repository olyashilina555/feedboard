<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Feedboard" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>Feedboard — Instagram Feed Planner</title>

  <style>
    :root {
      --bg: #f6f6f4;
      --panel: #ffffff;
      --text: #151515;
      --muted: #777;
      --line: #e9e9e6;
      --accent: #151515;
      --danger: #b42318;
      --radius: 20px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .app {
      width: min(760px, 100%);
      margin: 0 auto;
      padding: 18px 14px 40px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .brand h1 {
      margin: 0;
      font-size: 26px;
      letter-spacing: -0.03em;
    }

    .brand p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
      box-shadow: 0 8px 30px rgba(0,0,0,.04);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }

    button, .file-button {
      appearance: none;
      border: 0;
      border-radius: 14px;
      background: #ededeb;
      color: var(--text);
      font-weight: 700;
      font-size: 14px;
      padding: 12px 14px;
      cursor: pointer;
      transition: .2s ease;
    }

    button:active, .file-button:active {
      transform: scale(.98);
    }

    .primary {
      background: var(--accent);
      color: white;
    }

    .danger {
      color: var(--danger);
    }

    input[type="file"] {
      display: none;
    }

    .hint {
      font-size: 13px;
      color: var(--muted);
      margin: 2px 2px 14px;
      line-height: 1.45;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
      background: #fff;
      border-radius: 14px;
      overflow: hidden;
      min-height: 200px;
      touch-action: manipulation;
    }

    .card {
      position: relative;
      aspect-ratio: 3 / 4;
      background: #ececea;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      cursor: grab;
    }

    .card.dragging {
      opacity: .45;
      outline: 3px solid #111;
      outline-offset: -3px;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    .badge {
      position: absolute;
      left: 6px;
      bottom: 6px;
      background: rgba(0,0,0,.64);
      color: white;
      border-radius: 999px;
      padding: 4px 7px;
      font-size: 10px;
      line-height: 1;
      backdrop-filter: blur(8px);
    }

    .remove {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 28px;
      height: 28px;
      padding: 0;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(0,0,0,.64);
      color: white;
      font-size: 17px;
      line-height: 1;
      z-index: 2;
    }

    .empty {
      grid-column: 1 / -1;
      min-height: 220px;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 36px 20px;
      color: var(--muted);
      font-size: 14px;
    }

    .footer-note {
      margin-top: 14px;
      font-size: 12px;
      line-height: 1.5;
      color: var(--muted);
      text-align: center;
    }

    .status {
      font-size: 12px;
      color: var(--muted);
      margin-left: auto;
      align-self: center;
    }

    @media (min-width: 620px) {
      .app { padding-top: 28px; }
      .grid { gap: 5px; }
      .panel { padding: 18px; }
    }
  </style>
</head>

<body>
  <main class="app">
    <div class="topbar">
      <div class="brand">
        <h1>Feedboard</h1>
        <p>Простой планировщик Instagram-ленты</p>
      </div>
    </div>

    <section class="panel">
      <div class="controls">
        <label class="file-button primary" for="fileInput">+ Добавить фото</label>
        <input id="fileInput" type="file" accept="image/*" multiple />

        <button id="reverseBtn" type="button">Развернуть порядок</button>
        <button id="clearBtn" type="button" class="danger">Очистить</button>

        <span id="status" class="status">Сохранено</span>
      </div>

      <div class="hint">
        Загрузи фото и перетаскивай их пальцем или мышкой. Порядок сохраняется автоматически прямо на этом устройстве.
      </div>

      <div id="grid" class="grid"></div>

      <div class="footer-note">
        Фото хранятся локально в браузере и не отправляются на сервер.
      </div>
    </section>
  </main>

<script>
const DB_NAME = "feedboard-db";
const STORE_NAME = "posts";
const DB_VERSION = 1;

let items = [];
let dragIndex = null;
let touchDragIndex = null;

const grid = document.getElementById("grid");
const fileInput = document.getElementById("fileInput");
const clearBtn = document.getElementById("clearBtn");
const reverseBtn = document.getElementById("reverseBtn");
const statusEl = document.getElementById("status");

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);

    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME, { keyPath: "id" });
      }
    };

    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function loadItems() {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readonly");
    const store = tx.objectStore(STORE_NAME);
    const req = store.getAll();

    req.onsuccess = () => {
      const result = (req.result || []).sort((a,b) => a.order - b.order);
      resolve(result);
    };
    req.onerror = () => reject(req.error);
  });
}

async function saveAll() {
  statusEl.textContent = "Сохраняю…";

  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readwrite");
    const store = tx.objectStore(STORE_NAME);

    store.clear();

    items.forEach((item, index) => {
      item.order = index;
      store.put(item);
    });

    tx.oncomplete = () => {
      statusEl.textContent = "Сохранено";
      resolve();
    };
    tx.onerror = () => {
      statusEl.textContent = "Ошибка сохранения";
      reject(tx.error);
    };
  });
}

function render() {
  grid.innerHTML = "";

  if (!items.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.innerHTML = "Здесь появится твоя лента.<br><br>Нажми <strong>«+ Добавить фото»</strong>.";
    grid.appendChild(empty);
    return;
  }

  items.forEach((item, index) => {
    const card = document.createElement("div");
    card.className = "card";
    card.draggable = true;
    card.dataset.index = index;
    card.dataset.id = item.id;

    const img = document.createElement("img");
    img.src = URL.createObjectURL(item.file);
    img.alt = "Пост " + (index + 1);

    const badge = document.createElement("span");
    badge.className = "badge";
    badge.textContent = index + 1;

    const remove = document.createElement("button");
    remove.className = "remove";
    remove.type = "button";
    remove.setAttribute("aria-label", "Удалить");
    remove.textContent = "×";

    remove.addEventListener("click", async (e) => {
      e.stopPropagation();
      items.splice(index, 1);
      render();
      await saveAll();
    });

    card.addEventListener("dragstart", () => {
      dragIndex = index;
      card.classList.add("dragging");
    });

    card.addEventListener("dragend", () => {
      dragIndex = null;
      card.classList.remove("dragging");
    });

    card.addEventListener("dragover", (e) => e.preventDefault());

    card.addEventListener("drop", async (e) => {
      e.preventDefault();
      if (dragIndex === null || dragIndex === index) return;

      const moved = items.splice(dragIndex, 1)[0];
      items.splice(index, 0, moved);

      dragIndex = null;
      render();
      await saveAll();
    });

    // Touch support for iPhone / Android.
    // На телефоне двигаем сами DOM-карточки, а массив обновляем в конце жеста.
    card.addEventListener("touchstart", (e) => {
      if (e.target.closest(".remove")) return;
      touchDragIndex = index;
      card.classList.add("dragging");
    }, { passive: true });

    card.addEventListener("touchmove", (e) => {
      if (touchDragIndex === null) return;

      const touch = e.touches[0];
      const target = document.elementFromPoint(touch.clientX, touch.clientY);
      const targetCard = target && target.closest(".card");

      if (!targetCard || targetCard === card || targetCard.parentElement !== grid) return;

      const cards = [...grid.querySelectorAll(".card")];
      const currentPos = cards.indexOf(card);
      const targetPos = cards.indexOf(targetCard);

      if (currentPos < targetPos) {
        grid.insertBefore(card, targetCard.nextSibling);
      } else {
        grid.insertBefore(card, targetCard);
      }
    }, { passive: true });

    card.addEventListener("touchend", async () => {
      const orderedIds = [...grid.querySelectorAll(".card")].map(el => el.dataset.id);
      items.sort((a, b) => orderedIds.indexOf(a.id) - orderedIds.indexOf(b.id));

      touchDragIndex = null;
      document.querySelectorAll(".dragging").forEach(el => el.classList.remove("dragging"));

      render();
      await saveAll();
    });

    card.appendChild(img);
    card.appendChild(badge);
    card.appendChild(remove);
    grid.appendChild(card);
  });
}

fileInput.addEventListener("change", async (e) => {
  const files = [...e.target.files];
  if (!files.length) return;

  for (const file of files) {
    items.push({
      id: crypto.randomUUID(),
      file,
      order: items.length
    });
  }

  render();
  await saveAll();
  fileInput.value = "";
});

clearBtn.addEventListener("click", async () => {
  if (!items.length) return;

  const ok = confirm("Удалить все фото из планировщика?");
  if (!ok) return;

  items = [];
  render();
  await saveAll();
});

reverseBtn.addEventListener("click", async () => {
  items.reverse();
  render();
  await saveAll();
});

(async function init() {
  try {
    items = await loadItems();
    render();
  } catch (err) {
    console.error(err);
    statusEl.textContent = "Не удалось загрузить";
    render();
  }
})();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(console.error);
  });
}
</script>
</body>
</html>
